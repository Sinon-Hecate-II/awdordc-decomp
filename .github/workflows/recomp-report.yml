name: Publish objdiff report

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare report
        run: |
          mkdir -p build
          cp build/yw2e/report.json build/report.json

      - name: Upload progress artifact
        uses: actions/upload-artifact@v4
        with:
          name: yw2e_report
          path: build/report.json